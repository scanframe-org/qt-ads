# Specify the build system.
[build-system]
requires = ["sip >=6.0.2", "PyQt-builder >=1.6", "PyQt5>=5.15", "PyQt5-sip>=12.8"]
build-backend = "sipbuild.api"

# Specify the PEP 566 metadata for the project.
[tool.sip.metadata]
name = "PyQtAds"
version = "4.4.1"
summary = "Python bindings for Qt Advanced Docking System"
home-page = "https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System/"
license = "LGPL v2.1"
description-file = "README.md"
requires-dist = "PyQt5 (>=5.15.4)"
description-content-type = "text/markdown"

[tool.sip.project]
tag-prefix = "QtAds"
dunder-init = true

[tool.sip.bindings.ads]
pep484-pyi = true
define-macros = ["ADS_SHARED_EXPORT"]
sip-file = "ads.sip"
include-dirs = ["src"]
qmake-QT = ["widgets", "gui-private; platform_system == 'Linux'"]
headers = [
    "src/CAutoHideDockContainer.h",
    "src/CAutoHideSideBar.h",
    "src/CAutoHideTab.h",
	"src/CDockAreaLayout.h",
	"src/CDockAreaTabBar.h",
	"src/CDockAreaTitleBar.h",
	"src/CDockAreaTitleBar_p.h",
	"src/CDockAreaWidget.h",
	"src/CDockComponentsFactory.h",
	"src/CDockContainerWidget.h",
	"src/CDockFocusController.h",
	"src/CDockManager.h",
	"src/CDockOverlay.h",
	"src/CDockOverlayCross.h",
	"src/CDockSplitter.h",
	"src/CDockWidget.h",
	"src/CDockWidgetTab.h",
	"src/CDockingStateReader.h",
	"src/CElidingLabel.h",
	"src/CFloatingDockContainer.h",
	"src/CFloatingDragPreview.h",
	"src/CIconProvider.h",
	"src/CSpacerWidget.h",
	"src/CTitleBarButton.h",
	"src/IFloatingWidget.h",
    "src/CPushButton.h",
    "src/CResizeHandle.h",
	"src/ads_globals.h",
	"src/linux/CFloatingWidgetTitleBar.h; platform_system == 'Linux'",
]
sources = [
    "src/CAutoHideTab.cpp",
    "src/CAutoHideDockContainer.cpp",
    "src/CAutoHideSideBar.cpp",
	"src/CDockAreaTabBar.cpp",
	"src/CDockAreaTitleBar.cpp",
	"src/CDockAreaWidget.cpp",
	"src/CDockComponentsFactory.cpp",
	"src/CDockContainerWidget.cpp",
	"src/CDockFocusController.cpp",
	"src/CDockManager.cpp",
	"src/CDockOverlay.cpp",
	"src/CDockSplitter.cpp",
	"src/CDockWidget.cpp",
	"src/CDockWidgetTab.cpp",
	"src/CDockingStateReader.cpp",
	"src/CElidingLabel.cpp",
	"src/CFloatingDockContainer.cpp",
	"src/CFloatingDragPreview.cpp",
	"src/CIconProvider.cpp",
	"src/CPushButton.cpp",
	"src/CResizeHandle.cpp",
	"src/ads_globals.cpp",
	"src/linux/CFloatingWidgetTitleBar.cpp; platform_system == 'Linux'",
]
